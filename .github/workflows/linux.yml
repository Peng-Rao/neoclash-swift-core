name: Linux Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      # The raw-socket integration tests are macOS-only; the crypto, TLS 1.3,
      # REALITY, Vision, GEO, group, and rule-matcher suites run here.
      - name: Test
        run: swift test
